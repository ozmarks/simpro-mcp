services:
  simpro-mcp:
    image: ghcr.io/ozmarks/simpro-mcp:latest
    container_name: simpro-mcp
    restart: unless-stopped
    environment:
      SIMPRO_TRANSPORT: broker
      SIMPRO_BASE_URL: ${SIMPRO_BASE_URL:?set SIMPRO_BASE_URL}
      SIMPRO_COMPANY_ID: ${SIMPRO_COMPANY_ID:-0}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      SIMPRO_CLIENT_ID: ${SIMPRO_CLIENT_ID:?set SIMPRO_CLIENT_ID}
      SIMPRO_CLIENT_SECRET: ${SIMPRO_CLIENT_SECRET:?set SIMPRO_CLIENT_SECRET}
      TOKEN_SEAL_KEY: ${TOKEN_SEAL_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - broker-state:/data

volumes:
  broker-state:
